<svg width="1200" height="980" viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
    <style>
      .title { font: bold 28px "Microsoft YaHei", sans-serif; fill: #000000; }
      .sub { font: 15px "Microsoft YaHei", sans-serif; fill: #000000; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .decision { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { font: 15px "Microsoft YaHei", sans-serif; fill: #000000; }
      .small { font: 14px "Microsoft YaHei", sans-serif; fill: #000000; }
      .line { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="960" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <text x="432" y="46" class="title">商品管理流程图</text>
  <text x="278" y="74" class="sub">对应后台商品查询、新增商品、编辑商品、上传封面及保存商品信息的业务流程</text>

  <rect x="455" y="105" width="290" height="56" class="box"/>
  <text x="508" y="140" class="text">管理员进入后台商品管理页面</text>

  <line x1="600" y1="161" x2="600" y2="205" class="line"/>

  <rect x="430" y="205" width="340" height="64" class="box"/>
  <text x="462" y="240" class="text">系统分页加载商品列表</text>
  <text x="450" y="262" class="small">Vue 调用 pageProducts() -> GET /admin/pms/products</text>

  <line x1="600" y1="269" x2="600" y2="318" class="line"/>

  <polygon points="600,318 760,382 600,446 440,382" class="decision"/>
  <text x="535" y="376" class="text">管理员是否输入</text>
  <text x="550" y="400" class="text">商品名称查询条件</text>

  <line x1="760" y1="382" x2="970" y2="382" class="line"/>
  <text x="835" y="370" class="small">是</text>
  <rect x="970" y="350" width="170" height="64" class="box"/>
  <text x="995" y="386" class="text">按名称模糊查询</text>
  <line x1="970" y1="446" x2="760" y2="446" class="dash"/>

  <line x1="600" y1="446" x2="600" y2="500" class="line"/>
  <text x="615" y="476" class="small">否</text>

  <rect x="440" y="500" width="320" height="64" class="box"/>
  <text x="480" y="536" class="text">后台返回商品分页结果并展示</text>

  <line x1="600" y1="564" x2="600" y2="616" class="line"/>

  <polygon points="600,616 760,680 600,744 440,680" class="decision"/>
  <text x="540" y="674" class="text">管理员点击“新增”</text>
  <text x="551" y="698" class="text">还是“编辑”</text>

  <line x1="440" y1="680" x2="230" y2="680" class="line"/>
  <text x="306" y="668" class="small">新增</text>
  <rect x="70" y="648" width="160" height="64" class="box"/>
  <text x="104" y="684" class="text">初始化空白表单</text>

  <line x1="760" y1="680" x2="970" y2="680" class="line"/>
  <text x="836" y="668" class="small">编辑</text>
  <rect x="970" y="648" width="170" height="64" class="box"/>
  <text x="992" y="684" class="text">回填当前商品信息</text>

  <line x1="150" y1="744" x2="150" y2="792" class="line"/>
  <line x1="1055" y1="712" x2="1055" y2="792" class="line"/>
  <line x1="150" y1="792" x2="600" y2="792" class="line"/>
  <line x1="1055" y1="792" x2="600" y2="792" class="line"/>

  <rect x="390" y="792" width="420" height="78" class="box"/>
  <text x="432" y="826" class="text">管理员填写商品名称、副标题、品牌、分类、价格、状态、详情等信息</text>
  <text x="486" y="850" class="small">可通过 uploadPms() 上传封面图</text>

  <line x1="600" y1="870" x2="600" y2="918" class="line"/>

  <rect x="390" y="918" width="420" height="64" class="box"/>
  <text x="426" y="954" class="text">单击保存，Vue 调用 saveProduct() -> POST /admin/pms/products</text>

  <line x1="600" y1="982" x2="600" y2="1032" class="line"/>

  <polygon points="600,1032 760,1096 600,1160 440,1096" class="decision"/>
  <text x="548" y="1090" class="text">商品是否存在编号</text>
  <text x="582" y="1114" class="text">id</text>

  <line x1="440" y1="1096" x2="240" y2="1096" class="line"/>
  <text x="308" y="1084" class="small">否</text>
  <rect x="80" y="1064" width="160" height="64" class="box"/>
  <text x="114" y="1100" class="text">新增商品记录</text>

  <line x1="760" y1="1096" x2="960" y2="1096" class="line"/>
  <text x="835" y="1084" class="small">是</text>
  <rect x="960" y="1064" width="160" height="64" class="box"/>
  <text x="994" y="1100" class="text">更新商品记录</text>

  <line x1="160" y1="1128" x2="160" y2="1180" class="line"/>
  <line x1="1040" y1="1128" x2="1040" y2="1180" class="line"/>
  <line x1="160" y1="1180" x2="600" y2="1180" class="line"/>
  <line x1="1040" y1="1180" x2="600" y2="1180" class="line"/>

  <rect x="410" y="1180" width="380" height="64" class="box"/>
  <text x="463" y="1216" class="text">保存成功，关闭弹窗并重新加载商品列表</text>
</svg>
