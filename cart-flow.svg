<svg width="980" height="1080" viewBox="0 0 980 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8a"/>
    </marker>
    <style>
      .title { font: bold 24px "Microsoft YaHei", sans-serif; fill: #1f2d3d; }
      .text { font: 16px "Microsoft YaHei", sans-serif; fill: #1f2d3d; }
      .small { font: 14px "Microsoft YaHei", sans-serif; fill: #1f2d3d; }
      .box { fill: #eef5fb; stroke: #2f5d8a; stroke-width: 2; rx: 12; ry: 12; }
      .decision { fill: #fff7e6; stroke: #c58b00; stroke-width: 2; }
      .end { fill: #e8f7e8; stroke: #3c8d40; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #2f5d8a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="395" y="40" class="title">购物车流程图</text>

  <rect x="390" y="70" width="200" height="55" class="box"/>
  <text x="427" y="105" class="text">浏览商品页面</text>

  <line x1="490" y1="125" x2="490" y2="160" class="line"/>

  <rect x="360" y="160" width="260" height="55" class="box"/>
  <text x="394" y="195" class="text">选择商品及数量</text>

  <line x1="490" y1="215" x2="490" y2="250" class="line"/>

  <rect x="360" y="250" width="260" height="55" class="box"/>
  <text x="394" y="285" class="text">单击加入购物车</text>

  <line x1="490" y1="305" x2="490" y2="340" class="line"/>

  <rect x="330" y="340" width="320" height="55" class="box"/>
  <text x="354" y="375" class="text">前端提交 skuId 和购买数量</text>

  <line x1="490" y1="395" x2="490" y2="430" class="line"/>

  <rect x="340" y="430" width="300" height="55" class="box"/>
  <text x="368" y="465" class="text">后端查询商品规格信息</text>

  <line x1="490" y1="485" x2="490" y2="520" class="line"/>

  <polygon points="490,520 620,575 490,630 360,575" class="decision"/>
  <text x="410" y="570" class="text">商品是否已存在</text>
  <text x="426" y="595" class="text">于购物车中</text>

  <line x1="620" y1="575" x2="800" y2="575" class="line"/>
  <text x="690" y="565" class="small">是</text>
  <rect x="800" y="545" width="140" height="60" class="box"/>
  <text x="822" y="582" class="text">更新商品数量</text>

  <line x1="490" y1="630" x2="490" y2="665" class="line"/>
  <text x="505" y="650" class="small">否</text>

  <rect x="360" y="665" width="260" height="55" class="box"/>
  <text x="394" y="700" class="text">新增购物车记录</text>

  <line x1="490" y1="720" x2="490" y2="755" class="line"/>

  <rect x="340" y="755" width="300" height="55" class="box"/>
  <text x="368" y="790" class="text">返回最新购物车数据</text>

  <line x1="490" y1="810" x2="490" y2="845" class="line"/>

  <rect x="340" y="845" width="300" height="55" class="box"/>
  <text x="354" y="880" class="text">前端展示购物车商品列表</text>

  <line x1="490" y1="900" x2="490" y2="935" class="line"/>

  <rect x="320" y="935" width="340" height="55" class="box"/>
  <text x="336" y="970" class="text">用户可勾选、删除或修改商品数量</text>

  <line x1="490" y1="990" x2="490" y2="1025" class="line"/>

  <rect x="390" y="1025" width="200" height="55" class="end"/>
  <text x="420" y="1060" class="text">完成购物车管理</text>
</svg>
