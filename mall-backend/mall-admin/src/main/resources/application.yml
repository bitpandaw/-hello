spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  application:
    name: mall-admin
  profiles:
    active: dev

mall:
  jwt:
    secret: "MallGraduation2026SecretKeyMustBeLongEnoughForHmac256BitsMall"
    access-expire-ms: 1800000
    refresh-expire-ms: 604800000
  file:
    upload-dir: ${user.home}/mall-uploads

# Knife4j / springdoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  setting:
    language: zh_cn

server:
  port: 8080

logging:
  level:
    com.mall: INFO
