<svg width="980" height="1080" viewBox="0 0 980 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8a"/>
    </marker>
    <style>
      .title { font: bold 24px "Microsoft YaHei", sans-serif; fill: #1f2d3d; }
      .text { font: 16px "Microsoft YaHei", sans-serif; fill: #1f2d3d; }
      .small { font: 14px "Microsoft YaHei", sans-serif; fill: #1f2d3d; }
      .box { fill: #eef5fb; stroke: #2f5d8a; stroke-width: 2; rx: 12; ry: 12; }
      .decision { fill: #fff7e6; stroke: #c58b00; stroke-width: 2; }
      .end { fill: #e8f7e8; stroke: #3c8d40; stroke-width: 2; rx: 18; ry: 18; }
      .fail { fill: #fdecec; stroke: #c23b3b; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #2f5d8a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="390" y="40" class="title">用户认证流程图</text>

  <rect x="390" y="70" width="200" height="55" class="box"/>
  <text x="435" y="105" class="text">进入登录页面</text>

  <line x1="490" y1="125" x2="490" y2="160" class="line"/>

  <rect x="360" y="160" width="260" height="55" class="box"/>
  <text x="385" y="195" class="text">输入用户名和密码并提交</text>

  <line x1="490" y1="215" x2="490" y2="250" class="line"/>

  <rect x="330" y="250" width="320" height="55" class="box"/>
  <text x="372" y="285" class="text">后端接收请求并查询用户信息</text>

  <line x1="490" y1="305" x2="490" y2="340" class="line"/>

  <polygon points="490,340 620,395 490,450 360,395" class="decision"/>
  <text x="418" y="390" class="text">账号和密码</text>
  <text x="442" y="415" class="text">是否正确</text>

  <line x1="620" y1="395" x2="780" y2="395" class="line"/>
  <text x="680" y="385" class="small">否</text>
  <rect x="780" y="365" width="150" height="60" class="fail"/>
  <text x="815" y="402" class="text">登录失败</text>

  <line x1="490" y1="450" x2="490" y2="495" class="line"/>
  <text x="505" y="475" class="small">是</text>

  <rect x="350" y="495" width="280" height="55" class="box"/>
  <text x="380" y="530" class="text">生成Access Token和Refresh Token</text>

  <line x1="490" y1="550" x2="490" y2="585" class="line"/>

  <rect x="350" y="585" width="280" height="55" class="box"/>
  <text x="390" y="620" class="text">返回Token到前端保存</text>

  <line x1="490" y1="640" x2="490" y2="675" class="line"/>

  <rect x="320" y="675" width="340" height="55" class="box"/>
  <text x="345" y="710" class="text">后续请求在请求头中携带Access Token</text>

  <line x1="490" y1="730" x2="490" y2="765" class="line"/>

  <rect x="340" y="765" width="300" height="55" class="box"/>
  <text x="380" y="800" class="text">过滤器校验Token合法性</text>

  <line x1="490" y1="820" x2="490" y2="855" class="line"/>

  <polygon points="490,855 620,910 490,965 360,910" class="decision"/>
  <text x="410" y="905" class="text">Token是否</text>
  <text x="426" y="930" class="text">有效</text>

  <line x1="620" y1="910" x2="780" y2="910" class="line"/>
  <text x="680" y="900" class="small">否</text>
  <rect x="780" y="880" width="150" height="60" class="fail"/>
  <text x="803" y="917" class="text">重新登录</text>

  <line x1="490" y1="965" x2="490" y2="1000" class="line"/>
  <text x="505" y="985" class="small">是</text>

  <rect x="390" y="1000" width="200" height="55" class="end"/>
  <text x="420" y="1035" class="text">允许访问系统资源</text>
</svg>
