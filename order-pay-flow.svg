<svg width="1200" height="980" viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
    <style>
      .title { font: bold 28px "Microsoft YaHei", sans-serif; fill: #000000; }
      .subtitle { font: 15px "Microsoft YaHei", sans-serif; fill: #000000; }
      .actor { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .actor-text { font: bold 18px "Microsoft YaHei", sans-serif; fill: #000000; }
      .phase { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .phase-text { font: bold 18px "Microsoft YaHei", sans-serif; fill: #000000; }
      .msg { font: 15px "Microsoft YaHei", sans-serif; fill: #000000; }
      .life { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .call { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #000000; stroke-width: 1.5; fill: none; stroke-dasharray: 8 5; marker-end: url(#arrow); }
      .active { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="960" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <text x="445" y="45" class="title">订单与支付时序图</text>
  <text x="315" y="72" class="subtitle">参与者：用户、Vue 前端、Spring Boot 后端、数据库</text>

  <rect x="90" y="100" width="120" height="48" class="actor"/>
  <text x="126" y="131" class="actor-text">用户</text>

  <rect x="345" y="100" width="150" height="48" class="actor"/>
  <text x="390" y="131" class="actor-text">Vue</text>

  <rect x="615" y="100" width="210" height="48" class="actor"/>
  <text x="656" y="131" class="actor-text">Spring Boot</text>

  <rect x="960" y="100" width="120" height="48" class="actor"/>
  <text x="996" y="131" class="actor-text">数据库</text>

  <line x1="150" y1="148" x2="150" y2="920" class="life"/>
  <line x1="420" y1="148" x2="420" y2="920" class="life"/>
  <line x1="720" y1="148" x2="720" y2="920" class="life"/>
  <line x1="1020" y1="148" x2="1020" y2="920" class="life"/>

  <rect x="80" y="190" width="1040" height="190" class="phase"/>
  <text x="110" y="220" class="phase-text">一、订单试算</text>

  <rect x="414" y="245" width="12" height="48" class="active"/>
  <line x1="150" y1="265" x2="420" y2="265" class="call"/>
  <text x="222" y="253" class="msg">1. 用户进入确认订单页面</text>

  <rect x="714" y="315" width="12" height="86" class="active"/>
  <line x1="420" y1="335" x2="720" y2="335" class="call"/>
  <text x="493" y="323" class="msg">2. Vue 请求订单试算</text>

  <rect x="1014" y="385" width="12" height="64" class="active"/>
  <line x1="720" y1="405" x2="1020" y2="405" class="call"/>
  <text x="790" y="393" class="msg">3. 查询地址、已选商品与价格</text>

  <line x1="1020" y1="470" x2="720" y2="470" class="ret"/>
  <text x="846" y="458" class="msg">4. 返回试算数据</text>

  <line x1="720" y1="520" x2="420" y2="520" class="ret"/>
  <text x="495" y="508" class="msg">5. 返回订单金额明细</text>

  <line x1="420" y1="570" x2="150" y2="570" class="ret"/>
  <text x="226" y="558" class="msg">6. 页面展示确认信息</text>

  <rect x="80" y="410" width="1040" height="220" class="phase"/>
  <text x="110" y="440" class="phase-text">二、订单创建</text>

  <rect x="414" y="470" width="12" height="48" class="active"/>
  <line x1="150" y1="490" x2="420" y2="490" class="call"/>
  <text x="250" y="478" class="msg">7. 用户提交订单</text>

  <rect x="714" y="540" width="12" height="118" class="active"/>
  <line x1="420" y1="560" x2="720" y2="560" class="call"/>
  <text x="489" y="548" class="msg">8. Vue 发送创建订单请求</text>

  <rect x="1014" y="615" width="12" height="92" class="active"/>
  <line x1="720" y1="635" x2="1020" y2="635" class="call"/>
  <text x="777" y="623" class="msg">9. 写入订单、扣减库存、清理购物车</text>

  <line x1="1020" y1="726" x2="720" y2="726" class="ret"/>
  <text x="845" y="714" class="msg">10. 返回订单结果</text>

  <line x1="720" y1="774" x2="420" y2="774" class="ret"/>
  <text x="514" y="762" class="msg">11. 返回订单编号</text>

  <line x1="420" y1="822" x2="150" y2="822" class="ret"/>
  <text x="213" y="810" class="msg">12. 跳转订单支付页面</text>

  <rect x="80" y="660" width="1040" height="220" class="phase"/>
  <text x="110" y="690" class="phase-text">三、订单支付</text>

  <rect x="414" y="720" width="12" height="48" class="active"/>
  <line x1="150" y1="740" x2="420" y2="740" class="call"/>
  <text x="238" y="728" class="msg">13. 用户确认支付</text>

  <rect x="714" y="790" width="12" height="86" class="active"/>
  <line x1="420" y1="810" x2="720" y2="810" class="call"/>
  <text x="486" y="798" class="msg">14. Vue 发送模拟支付请求</text>

  <rect x="1014" y="860" width="12" height="64" class="active"/>
  <line x1="720" y1="880" x2="1020" y2="880" class="call"/>
  <text x="760" y="868" class="msg">15. 更新订单状态并写入支付流水</text>

  <line x1="1020" y1="942" x2="720" y2="942" class="ret"/>
  <text x="856" y="930" class="msg">16. 返回支付结果</text>

  <line x1="720" y1="990" x2="420" y2="990" class="ret"/>
  <text x="522" y="978" class="msg">17. 返回支付成功</text>

  <line x1="420" y1="1038" x2="150" y2="1038" class="ret"/>
  <text x="192" y="1026" class="msg">18. 跳转订单详情页，流程结束</text>
</svg>
