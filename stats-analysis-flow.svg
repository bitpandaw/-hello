<svg width="1200" height="1700" viewBox="0 0 1200 1700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
    <style>
      .title { font: bold 30px "Microsoft YaHei", sans-serif; fill: #000000; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 10; ry: 10; }
      .decision { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .end { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 18; ry: 18; }
      .text { font: 16px "Microsoft YaHei", sans-serif; fill: #000000; }
      .small { font: 14px "Microsoft YaHei", sans-serif; fill: #000000; }
      .line { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="1680" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430" y="50" class="title">统计分析流程图</text>

  <rect x="420" y="90" width="360" height="56" class="box"/>
  <text x="484" y="125" class="text">管理员进入后台首页 Dashboard</text>

  <line x1="600" y1="146" x2="600" y2="188" class="line"/>

  <rect x="310" y="188" width="580" height="68" class="box"/>
  <text x="354" y="223" class="text">前端页面 mounted 后并发请求统计接口与图表接口</text>
  <text x="403" y="246" class="small">Promise.all([getStats(), getCharts()])</text>

  <line x1="600" y1="256" x2="600" y2="304" class="line"/>

  <rect x="280" y="304" width="640" height="68" class="box"/>
  <text x="372" y="339" class="text">前端向后台发送 GET /admin/stats 与 GET /admin/stats/charts</text>
  <text x="334" y="362" class="small">mall-admin-web/src/api/admin.js -&gt; AdminStatsController</text>

  <line x1="600" y1="372" x2="600" y2="420" class="line"/>

  <rect x="330" y="420" width="540" height="68" class="box"/>
  <text x="410" y="455" class="text">AdminStatsController 接收请求并分发业务</text>
  <text x="387" y="478" class="small">s() -&gt; home()，charts() -&gt; charts()</text>

  <line x1="600" y1="488" x2="600" y2="536" class="line"/>

  <polygon points="600,536 760,602 600,668 440,602" class="decision"/>
  <text x="514" y="596" class="text">当前访问用户</text>
  <text x="490" y="621" class="text">是否为管理员身份</text>

  <line x1="760" y1="602" x2="990" y2="602" class="line"/>
  <text x="850" y="589" class="small">否</text>
  <rect x="990" y="572" width="140" height="60" class="end"/>
  <text x="1023" y="609" class="text">拒绝访问</text>

  <line x1="600" y1="668" x2="600" y2="716" class="line"/>
  <text x="614" y="694" class="small">是</text>

  <rect x="250" y="716" width="700" height="78" class="box"/>
  <text x="322" y="751" class="text">home() 统计近 30 天订单数量、GMV 与新增用户数量</text>
  <text x="272" y="774" class="small">查询 oms_order(status &gt;= 1, create_time &gt;= DATE_SUB(CURDATE(), INTERVAL 29 DAY), deleted = 0)</text>

  <line x1="600" y1="794" x2="600" y2="842" class="line"/>

  <rect x="250" y="842" width="700" height="78" class="box"/>
  <text x="330" y="877" class="text">charts() 统计近 30 日 GMV 曲线与商品销量 TOP10</text>
  <text x="267" y="900" class="small">gmvLast30Days 按日期分组聚合，top10Sku 按订单项数量汇总并排序</text>

  <line x1="600" y1="920" x2="600" y2="968" class="line"/>

  <rect x="320" y="968" width="560" height="68" class="box"/>
  <text x="400" y="1003" class="text">后台封装 Result 对象并返回统计 JSON 数据</text>
  <text x="368" y="1026" class="small">Result&lt;StatsVO&gt; 与 Result&lt;ChartVO&gt;</text>

  <line x1="600" y1="1036" x2="600" y2="1084" class="line"/>

  <rect x="290" y="1084" width="620" height="68" class="box"/>
  <text x="355" y="1119" class="text">前端接收 last30DayOrderCount、last30DayGmv、last30DayNewUser</text>
  <text x="435" y="1142" class="small">Object.assign(s, a.data || {})</text>

  <line x1="600" y1="1152" x2="600" y2="1200" class="line"/>

  <rect x="260" y="1200" width="680" height="78" class="box"/>
  <text x="320" y="1235" class="text">前端读取 gmvLast30Days 与 top10Sku 并初始化 ECharts 图表</text>
  <text x="354" y="1258" class="small">折线图展示近 30 日 GMV，柱状图展示 SPU 销量 TOP10</text>

  <line x1="600" y1="1278" x2="600" y2="1326" class="line"/>

  <rect x="350" y="1326" width="500" height="68" class="box"/>
  <text x="430" y="1361" class="text">Element Plus 统计卡片渲染基础指标</text>
  <text x="412" y="1384" class="small">近30天订单、近30天 GMV、近30天新用户</text>

  <line x1="600" y1="1394" x2="600" y2="1442" class="line"/>

  <rect x="340" y="1442" width="520" height="68" class="box"/>
  <text x="406" y="1477" class="text">ResizeObserver 监听容器变化并自适应重绘</text>
  <text x="436" y="1500" class="small">gChart.resize() / tChart.resize()</text>

  <line x1="600" y1="1510" x2="600" y2="1560" class="line"/>

  <rect x="360" y="1560" width="480" height="68" class="end"/>
  <text x="423" y="1600" class="text">后台首页完成统计分析展示</text>
</svg>
